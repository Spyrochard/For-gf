<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 💙💛</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Poppins", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #bdeeff, #fff3a8);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #31506b;
        }

        /* Soft background glow */
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            filter: blur(80px);
            top: -150px;
            left: -150px;
        }

        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 221, 76, 0.25);
            border-radius: 50%;
            filter: blur(70px);
            bottom: -150px;
            right: -100px;
        }

        .container {
            position: relative;
            z-index: 2;
            width: min(90%, 650px);
            min-height: 430px;
            padding: 50px 35px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 2px solid rgba(255, 255, 255, 0.75);
            border-radius: 35px;
            box-shadow: 0 25px 60px rgba(54, 110, 140, 0.18);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .heart {
            font-size: 55px;
            margin-bottom: 25px;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            15% {
                transform: scale(1.15);
            }
            30% {
                transform: scale(1);
            }
            45% {
                transform: scale(1.1);
            }
        }

        .message {
            font-size: clamp(25px, 5vw, 40px);
            font-weight: 700;
            line-height: 1.35;
            max-width: 560px;
            min-height: 145px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.7s ease;
        }

        .small {
            font-size: clamp(22px, 4vw, 31px);
        }

        .final {
            color: #e5b800;
            font-size: clamp(30px, 6vw, 48px);
            text-shadow: 0 3px 12px rgba(255, 210, 50, 0.25);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        button {
            margin-top: 30px;
            border: none;
            padding: 14px 32px;
            border-radius: 999px;
            background: #ffe06b;
            color: #40566b;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(220, 180, 30, 0.25);
            transition: 0.25s ease;
        }

        button:hover {
            transform: translateY(-3px) scale(1.03);
            background: #ffd83d;
            box-shadow: 0 12px 25px rgba(220, 180, 30, 0.3);
        }

        button:active {
            transform: scale(0.97);
        }

        .counter {
            position: absolute;
            bottom: 18px;
            font-size: 13px;
            opacity: 0.55;
        }

        /* Floating decorations */
        .floating {
            position: absolute;
            z-index: 1;
            pointer-events: none;
            animation: floatUp linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            from {
                transform: translateY(110vh) rotate(0deg);
            }
            to {
                transform: translateY(-15vh) rotate(360deg);
            }
        }

        .one {
            left: 8%;
            font-size: 25px;
            animation-duration: 8s;
        }

        .two {
            left: 25%;
            font-size: 18px;
            animation-duration: 11s;
            animation-delay: 2s;
        }

        .three {
            left: 70%;
            font-size: 28px;
            animation-duration: 9s;
            animation-delay: 1s;
        }

        .four {
            left: 88%;
            font-size: 20px;
            animation-duration: 12s;
            animation-delay: 3s;
        }

        @media (max-width: 500px) {
            .container {
                min-height: 400px;
                padding: 40px 22px;
                border-radius: 28px;
            }

            .message {
                min-height: 160px;
            }

            .heart {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating decorations -->
    <div class="floating one">💙</div>
    <div class="floating two">⭐</div>
    <div class="floating three">💛</div>
    <div class="floating four">✨</div>

    <main class="container">

        <div class="heart" id="heart">💙</div>

        <div class="message" id="message">
            hi baby! 💙
        </div>

        <button id="nextButton" onclick="nextMessage()">
            next 💛
        </button>

        <div class="counter" id="counter">
            1 / 5
        </div>

    </main>

    <script>
        const messages = [
            {
                text: "hi baby! 💙",
                heart: "💙",
                className: ""
            },
            {
                text: "i know things have been tiring for you lately",
                heart: "🌤️",
                className: "small"
            },
            {
                text: "but i hope you know things will work out in the end",
                heart: "💛",
                className: "small"
            },
            {
                text: "but also don't forget how much of an amazing person you are!",
                heart: "✨",
                className: "small"
            },
            {
                text: "i love you so so so much ❤️",
                heart: "💙",
                className: "final"
            }
        ];

        let current = 0;

        function nextMessage() {
            current++;

            if (current >= messages.length) {
                current = 0;
            }

            const message = document.getElementById("message");
            const heart = document.getElementById("heart");
            const counter = document.getElementById("counter");
            const button = document.getElementById("nextButton");

            // Restart animation
            message.style.animation = "none";
            void message.offsetWidth;
            message.style.animation = "fadeIn 0.7s ease";

            message.textContent = messages[current].text;
            message.className = "message " + messages[current].className;

            heart.textContent = messages[current].heart;

            counter.textContent = `${current + 1} / ${messages.length}`;

            if (current === messages.length - 1) {
                button.textContent = "again? 💙";
            } else {
                button.textContent = "next 💛";
            }
        }
    </script>

</body>
</html>
